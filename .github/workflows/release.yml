name: Release

on:
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - name: Install build dependencies
              run: ./scripts/build-dependencies.sh

            - name: Verify release version
              id: version
              run: |
                  if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                      echo "Releases must be run from the main branch."
                      exit 1
                  fi

                  debian_version="$(dpkg-parsechangelog --show-field Version)"
                  upstream_version="${debian_version%-*}"
                  tag="v${upstream_version}"

                  if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
                      echo "Tag ${tag} already exists."
                      exit 1
                  fi

                  echo "upstream_version=${upstream_version}" >>"$GITHUB_OUTPUT"
                  echo "tag=${tag}" >>"$GITHUB_OUTPUT"

            - name: Configure, build, test, and package
              working-directory: ctprintf
              run: cmake --workflow --fresh --preset release-workflow

            - name: Build Debian package
              run: ./scripts/build-package.sh

            - name: Create GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  name: Release ${{ steps.version.outputs.tag }}
                  generate_release_notes: true
                  files: |
                      ctprintf/build/release/*.tar.gz
                      build/debian/*.deb
                      build/debian/*.buildinfo
                      build/debian/*.changes
