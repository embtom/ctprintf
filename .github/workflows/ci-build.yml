name: ci-build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Install build dependencies
              run: ./scripts/build-dependencies.sh

            - name: Check C++ formatting
              run: ./scripts/lint.sh cpp-format

            - name: Check CMake formatting
              run: ./scripts/lint.sh cmake-format

            - name: Lint CMake files
              run: ./scripts/lint.sh cmake-lint

            - name: Configure, build, and test
              working-directory: ctprintf
              run: cmake --workflow --preset release-workflow

            - name: Build Debian package
              run: ./scripts/build-package.sh

            - name: Upload packages
              uses: actions/upload-artifact@v7
              with:
                  name: ctprintf-packages
                  path: |
                      ctprintf/build/release/*.tar.zst
                      build/debian/
                  if-no-files-found: error
